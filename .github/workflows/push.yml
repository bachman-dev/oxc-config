name: Push Jobs
on:
  push:
    branches:
      - main
  repository_dispatch:
jobs:
  test:
    name: Test Pushed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Build Package
        run: pnpm build
      - name: Check Types
        run: pnpm typecheck
      - name: Build Docs
        run: pnpm build:docs
      - name: Check Formatting
        run: pnpm format:check
      - name: Lint Code
        run: pnpm lint
